plugins {
    id 'com.android.application'
}
android {
    namespace 'com.archmoba.orbitlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.archmoba.orbitlauncher'
        minSdk 26
        targetSdk 33
        versionCode 12
        versionName '0.12.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
