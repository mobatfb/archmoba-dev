plugins {
    id 'com.android.application'
}

android {
    namespace 'com.archmoba.himnospoliciales'
    compileSdk 35

    defaultConfig {
        applicationId 'com.archmoba.himnospoliciales'
        minSdk 26
        targetSdk 33
        versionCode 12
        versionName '1.3.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['mp3']
    }
}
