plugins {
    id 'com.android.application'
}

android {
    namespace 'com.archmoba.himnospoliciales'
    compileSdk 35

    defaultConfig {
        applicationId 'com.archmoba.himnospoliciales'
        minSdk 26
        targetSdk 33
        versionCode 13
        versionName '1.3.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['mp3']
    }
}

// FileProvider permite compartir una copia APK mediante URI content:// segura.
dependencies {
    implementation 'androidx.core:core:1.13.1'
}
