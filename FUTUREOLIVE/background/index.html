<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050B1C">
  <title>FUTUREO — Background por capas</title>
  <style>
    :root { --fondo: #050B1C; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: var(--fondo); overflow: hidden; }
    .escena {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background: var(--fondo);
    }
    .layer {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }
    /* Añadiremos los demás archivos después de layer0, en orden ascendente.
       La animación de humo, luces y partículas se aplicará a capas separadas. */
    #layer0 { z-index: 0; }
  </style>
</head>
<body>
  <main class="escena" aria-label="Fondo FUTUREO — lienzo 16:9 por capas">
    <img class="layer" id="layer0" src="./layer0.svg" alt="Base azul oscuro de FUTUREO">
    <!-- La siguiente capa será layer1 (detalles diagonales). -->
  </main>
</body>
</html>
