<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTUREO LIVE | Visor remoto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050C1D; }
    #stage { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
    .layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .text-layer { display: flex; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>
  <main id="stage" aria-label="FUTUREO LIVE: escena remota por capas"></main>
  <script>
    "use strict";
    // Esta es la UNICA ruta de GitHub configurada en el visor.
    // fondo1.bg decide los recursos, el orden y el contenido de las capas.
    const BG_MANIFEST_URL = "https://raw.githubusercontent.com/mobatfb/archmoba-dev/main/FUTUREOLIVE/background/fondo1.bg";
    const stage = document.getElementById("stage");
    let lastRevision = "";
    let installedStyles = [];

    async function fetchText(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status + ": " + url);
      return response.text();
    }

    function resourceUrl(base, relative, revision) {
      if (typeof relative !== "string" ||
          !/^[a-zA-Z0-9._/-]+$/.test(relative) ||
          relative.startsWith("/") || relative.split("/").includes("..")) {
        throw new Error("Ruta de recurso no permitida");
      }
      return new URL(relative + "?v=" + encodeURIComponent(revision), base).href;
    }

    async function loadBackground() {
      try {
        // Un .bg se lee como texto JSON: no depende del MIME que devuelva GitHub.
        const manifest = JSON.parse(
          await fetchText(BG_MANIFEST_URL + "?t=" + Date.now())
        );
        if (manifest.format !== "futureo-bg/v1" ||
            !Array.isArray(manifest.layers)) {
          throw new Error("Formato de fondo1.bg no compatible");
        }

        const signature = JSON.stringify(manifest);
        if (signature === lastRevision) return;

        // SOLO recursos remotos de esta carpeta del repositorio.
        const base = new URL(manifest.resourcesRoot);
        const expected = new URL("./", BG_MANIFEST_URL);
        if (base.href !== expected.href) {
          throw new Error("Origen remoto no autorizado en fondo1.bg");
        }

        const ordered = [...manifest.layers]
          .filter(layer => layer.visible !== false)
          .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));

        const built = await Promise.all(ordered.map(async layer => {
          if (!/^layer[0-9]+$/.test(layer.id)) {
            throw new Error("Identificador de capa no valido");
          }
          const el = document.createElement("div");
          el.id = layer.id;
          el.className = "layer";
          el.style.zIndex = String(Number(layer.order) || 0);
          const url = resourceUrl(base, layer.resource, manifest.version);
          if (layer.type === "css") {
            const style = document.createElement("style");
            style.dataset.layer = layer.id;
            style.textContent = await fetchText(url);
            return { el, style };
          }
          if (layer.type === "text") {
            const config = JSON.parse(await fetchText(url));
            el.classList.add("text-layer");
            el.textContent = String(config.text ?? "");
            el.style.color = config.color || "#FFFFFF";
            el.style.fontSize = config.fontSize || "clamp(40px, 8vw, 140px)";
            el.style.fontWeight = String(config.fontWeight || 700);
            el.style.letterSpacing = config.letterSpacing || "normal";
            el.style.fontFamily = config.fontFamily || "Arial, sans-serif";
            el.style.textShadow = config.textShadow || "none";
            return { el };
          }
          throw new Error("Tipo de capa no reconocido: " + layer.type);
        }));

        // Actualizar la escena solo cuando hayan cargado TODAS las capas.
        const fragment = document.createDocumentFragment();
        const nextStyles = [];
        for (const { el, style } of built) {
          fragment.appendChild(el);
          if (style) nextStyles.push(style);
        }
        stage.replaceChildren(fragment);
        for (const style of installedStyles) style.remove();
        installedStyles = nextStyles;
        for (const style of nextStyles) document.head.appendChild(style);
        stage.style.background = manifest.stage?.background || "#050C1D";
        lastRevision = signature;
      } catch (error) {
        // Conservar la ultima escena visible ante un fallo de red.
        console.error("[FUTUREO] Error al cargar fondo1.bg:", error);
      }
    }

    loadBackground();
    // Actualizacion remota sin recargar index.html.
    setInterval(loadBackground, 60000);
  </script>
</body>
</html>
