<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTUREO LIVE | Visor de capas remotas</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#202020; }
    #stage { position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#202020; }
    #canvas {
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      overflow:hidden;isolation:isolate;
    }
    .layer {
      position:absolute;inset:0;width:100%;height:100%;
      pointer-events:none;user-select:none;display:block;
    }
    img.layer {
      object-fit:fill;
    }
    .text-layer {
      display:flex;align-items:center;justify-content:center;text-align:center;
    }
    video.layer { object-fit:cover; background:#050A19; }
    /* La geometria y el diseño se conservan: las animaciones vienen de GitHub. */
    .layer.motion-active {
      animation-duration: var(--layer-duration, 10s);
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-fill-mode: both;
      animation-play-state: running;
      transform-origin: center center;
      will-change: transform, filter, opacity;
    }
    html.motion-paused .layer.motion-active { animation-play-state: paused !important; }
    html.motion-off .layer.motion-active {
      animation: none !important;
      transform: none !important;
      filter: none !important;
    }
    @media (prefers-reduced-motion: reduce) {
      .layer.motion-active {
        animation: none !important;
        transform: none !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Escena remota FUTUREO LIVE">
    <div id="canvas"></div>
  </main>
  <script>
    "use strict";
    // Unico enlace fijo del visor. TODO se obtiene de este manifiesto GitHub.
    const BG_MANIFEST_URL = "https://raw.githubusercontent.com/mobatfb/archmoba-dev/main/FUTUREOLIVE/background/fondo1.bg";
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("canvas");
    let currentStage = { width: 815, height: 286, background: "#202020" };
    let lastSignature = "";
    let installedStyles = [];
    let refreshInProgress = false;
    const allowedMotionPresets = new Set([
      "ambient-pulse", "blue-glow", "violet-light", "cyan-light",
      "soft-bloom", "purple-atmosphere", "purple-smoke",
      "cyan-smoke", "particles"
    ]);
    const forceStill = new URLSearchParams(location.search).get("motion") === "off";
    if (forceStill) document.documentElement.classList.add("motion-off");
    window.addEventListener("keydown", event => {
      if (event.code === "Space" && !event.repeat &&
          !["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)) {
        event.preventDefault();
        const paused = document.documentElement.classList.toggle("motion-paused");
        canvas.querySelectorAll("video").forEach(v => paused ? v.pause() : v.play().catch(()=>{}));
      }
    });

    function layout() {
      const w = Math.max(1, Number(currentStage.width) || 815);
      const h = Math.max(1, Number(currentStage.height) || 286);
      // Respetar la proporcion nativa: no aplastar ni recortar la referencia.
      const scale = Math.min(innerWidth / w, innerHeight / h);
      canvas.style.width = (w * scale) + "px";
      canvas.style.height = (h * scale) + "px";
    }
    window.addEventListener("resize", layout);

    function getUrl(root, resource, revision) {
      if (typeof resource !== "string" ||
          !/^[a-zA-Z0-9_.\/-]+$/.test(resource) ||
          resource.startsWith("/") || resource.split("/").includes("..")) {
        throw new Error("Ruta remota no permitida: " + String(resource));
      }
      return new URL(resource + "?v=" + encodeURIComponent(revision), root).href;
    }

    async function getText(url) {
      const response = await fetch(url,{cache:"no-store"});
      if (!response.ok) throw new Error("Error HTTP " + response.status + " en " + url);
      return response.text();
    }

    async function buildLayer(def,root,rev,stageConfig) {
      if (!/^layer[0-9]+$/.test(def.id)) {
        throw new Error("ID de capa no valido");
      }
      let element = null;
      let style = null;
      const url = getUrl(root,def.resource,rev);

      if (def.type === "image") {
        const img = new Image();
        img.className = "layer";
        img.alt = "";
        img.draggable = false;
        img.decoding = "async";
        img.src = url;
        await img.decode(); // No mostrar una composicion a medias.
        element = img;
      } else if (def.type === "video") {
        const video = document.createElement("video");
        video.className = "layer";
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.preload = "auto";
        video.controls = false;
        video.style.objectFit = ["contain","cover","fill"].includes(def.fit) ? def.fit : "cover";
        video.src = url;
        element = video;
      } else {
        element = document.createElement("div");
        element.className = "layer";
        if (def.type === "css") {
          style = document.createElement("style");
          style.textContent = await getText(url);
        } else if (def.type === "text") {
          const txt = JSON.parse(await getText(url));
          element.classList.add("text-layer");
          element.textContent = String(txt.text || "");
          element.style.color = txt.color || "white";
          element.style.fontSize = txt.fontSize || "clamp(40px, 10vw, 160px)";
          element.style.fontWeight = String(txt.fontWeight || 700);
        } else {
          throw new Error("Tipo de capa desconocido: " + def.type);
        }
      }
      element.id = def.id;
      if (["x","y","width","height"].some(k => def[k] !== undefined)) {
        const sw = Number(stageConfig?.width) || 1920, sh = Number(stageConfig?.height) || 1080;
        const x = Number(def.x ?? 0), y = Number(def.y ?? 0);
        const w = Number(def.width ?? sw), h = Number(def.height ?? sh);
        if (![x,y,w,h].every(Number.isFinite) || w <= 0 || h <= 0) throw new Error("Geometria invalida: " + def.id);
        element.style.inset = "auto";
        element.style.left = (x / sw * 100) + "%";
        element.style.top = (y / sh * 100) + "%";
        element.style.width = (w / sw * 100) + "%";
        element.style.height = (h / sh * 100) + "%";
      }
      element.style.zIndex = String(Number(def.order) || 0);
      element.style.opacity = String(
        Math.max(0,Math.min(1,Number(def.opacity ?? 1)))
      );
      // El archivo fondo1.bg elige el efecto; index.html no modifica las imagenes.
      const motion = def.motion;
      if (motion && motion.enabled !== false &&
          allowedMotionPresets.has(String(motion.preset))) {
        const seconds = Number(motion.seconds);
        const speed = Number(window._futureoMotionSpeed || 1);
        element.classList.add("motion-active", "motion-" + motion.preset);
        element.style.setProperty("--layer-duration",
          (Number.isFinite(seconds) ? Math.max(2,Math.min(120,seconds)) : 10) /
          Math.max(.25, Math.min(4,speed)) + "s");
      }
      return {element,style};
    }

    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;
      try {
        // Leer el .bg como texto porque GitHub puede servirlo con MIME octet-stream.
        const bg = JSON.parse(
          await getText(BG_MANIFEST_URL + "?_=" + Date.now())
        );
        if (bg.format !== "futureo-bg/v1" || !Array.isArray(bg.layers)
            || bg.layers.length > 64) {
          throw new Error("El archivo fondo1.bg no es valido");
        }
        const root = new URL(bg.resourcesRoot);
        const allowedRoot = new URL("./",BG_MANIFEST_URL);
        if (root.href !== allowedRoot.href) {
          throw new Error("Origen remoto de capas no autorizado");
        }
        const signature = JSON.stringify(bg);
        if (signature === lastSignature) return;
        const ordered = bg.layers.filter(x=>x.visible !== false)
          .sort((a,b)=>Number(a.order||0)-Number(b.order||0));
        window._futureoMotionSpeed = Math.max(.25,Math.min(4,
          Number(bg.motion?.speed) || 1));
        const loaded = await Promise.all(
          ordered.map(def=>buildLayer(def,root,bg.version || "1",bg.stage))
        );
        // Las hojas de estilo tambien vienen del manifiesto remoto.
        const stylePaths = Array.isArray(bg.styles) ? bg.styles : [];
        if (stylePaths.length > 8) throw new Error("Demasiados archivos CSS");
        const remoteStyles = await Promise.all(stylePaths.map(async path => {
          const node = document.createElement("style");
          node.dataset.remote = path;
          node.textContent = await getText(getUrl(root,path,bg.version || "1"));
          return node;
        }));
        const fragment = document.createDocumentFragment();
        const nextStyles=[...remoteStyles];
        for (const {element,style} of loaded) {
          fragment.appendChild(element);
          if (style) nextStyles.push(style);
        }
        // Estilos y capas actualizados juntos sin dejar la escena vacia.
        nextStyles.forEach(el=>document.head.appendChild(el));
        canvas.replaceChildren(fragment);
        installedStyles.forEach(el=>el.remove());
        installedStyles=nextStyles;
        const s=bg.stage||{};
        currentStage={
          width:Number(s.width)||815,height:Number(s.height)||286,
          background:/^#[0-9A-Fa-f]{6}$/.test(s.background||"")
            ? s.background:"#202020"
        };
        stage.style.background = currentStage.background;
        layout();
        canvas.querySelectorAll("video").forEach(v => {
          if (document.documentElement.classList.contains("motion-paused") || document.documentElement.classList.contains("motion-off")) v.pause();
          else v.play().catch(error => console.warn("[FUTUREO] Reproduccion pendiente", error));
        });
        lastSignature=signature;
      } catch(error) {
        // Si no hay internet, mantener la ultima escena cargada.
        console.error("[FUTUREO] No se pudo actualizar fondo1.bg",error);
      } finally {
        refreshInProgress = false;
      }
    }

    window.FutureoBackground = {
      reload: refresh,
      pause() { document.documentElement.classList.add("motion-paused"); canvas.querySelectorAll("video").forEach(v => v.pause()); },
      resume() { document.documentElement.classList.remove("motion-paused", "motion-off"); canvas.querySelectorAll("video").forEach(v => v.play().catch(()=>{})); },
      still() { document.documentElement.classList.add("motion-off"); canvas.querySelectorAll("video").forEach(v => v.pause()); },
      animate() { document.documentElement.classList.remove("motion-off"); if (!document.documentElement.classList.contains("motion-paused")) canvas.querySelectorAll("video").forEach(v => v.play().catch(()=>{})); }
    };

    layout();
    refresh();
    setInterval(refresh,60000);
  </script>
</body>
</html>
