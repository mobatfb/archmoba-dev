<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTUREO LIVE | Fondo MP4 4K</title>
  <style>
    * {box-sizing:border-box}
    html,body {width:100%;height:100%;margin:0;overflow:hidden;background:#050a19}
    video,img {
      position:fixed;inset:0;display:block;width:100vw;height:100vh;
      object-fit:cover;pointer-events:none;user-select:none;
    }
    #respaldo {display:none}
    @media (prefers-reduced-motion: reduce) {
      video {opacity:.75}
    }
  </style>
</head>
<body>
  <video id="fondo" autoplay muted loop playsinline preload="auto"
         aria-label="Fondo animado FUTUREO LIVE en video 4K">
    <source src="./fondo_animado_4k.mp4" type="video/mp4">
    <source src="./fondo_animado.mp4" type="video/mp4">
  </video>
  <img id="respaldo" src="./fondo_animado.gif" alt="Fondo animado FUTUREO LIVE">
  <script>
    const video=document.getElementById('fondo');
    const imagen=document.getElementById('respaldo');
    function usarGif(){video.style.display='none';imagen.style.display='block'}
    video.addEventListener('error',usarGif);
    video.play().catch(usarGif);
  </script>
</body>
</html>
