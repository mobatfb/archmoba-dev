<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FUTUREO LIVE | Fondo animado</title>
  <style>
    :root {
      --azul-oscuro: #050a19;
      --cyan: #12dffc;
      --azul: #086edb;
      --violeta: #9345ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--azul-oscuro);
    }
    body { isolation: isolate; }
    .escena {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      background:
        radial-gradient(ellipse 56% 72% at 100% -14%, rgba(23, 49, 122, .38), transparent 75%),
        radial-gradient(ellipse 61% 75% at -18% 112%, rgba(30, 23, 102, .34), transparent 78%),
        linear-gradient(145deg, #060918 0%, #090d21 47%, #060b1b 100%);
    }
    .escena::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(2, 4, 15, .35) 100%);
      z-index: 12;
    }
    .cuadricula {
      position: absolute; inset: -60%;
      background-image:
        linear-gradient(rgba(42, 123, 210, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 123, 210, .07) 1px, transparent 1px);
      background-size: 76px 76px;
      transform: perspective(950px) rotateX(59deg) scale(1.35);
      transform-origin: center 80%;
      opacity: .42; animation: malla 30s linear infinite;
    }
    .particulas {
      position: absolute; inset: -12%;
      background-image:
        radial-gradient(circle, rgba(145, 225, 255, .50) 1px, transparent 1.6px),
        radial-gradient(circle, rgba(165, 112, 255, .38) 1px, transparent 1.7px),
        radial-gradient(circle, rgba(36, 181, 249, .35) 1px, transparent 1.6px);
      background-size: 177px 151px, 231px 193px, 293px 211px;
      background-position: 19px 28px, 62px 87px, 118px 52px;
      animation: polvo 33s ease-in-out infinite alternate;
      opacity: .7;
    }
    .halo {
      position: absolute; width: 72vmax; height: 72vmax;
      border-radius: 50%; filter: blur(90px);
      will-change: transform, opacity; opacity: .35;
    }
    .halo.cian {
      right: -40vmax; top: -43vmax;
      background: radial-gradient(circle, rgba(7, 201, 251, .45), rgba(7, 120, 235, .12) 45%, transparent 70%);
      animation: haloCian 19s ease-in-out infinite alternate;
    }
    .halo.morado {
      left: -39vmax; bottom: -40vmax;
      background: radial-gradient(circle, rgba(149, 55, 248, .42), rgba(48, 53, 198, .15) 42%, transparent 70%);
      animation: haloMorado 22s ease-in-out infinite alternate;
    }
    .halo.central {
      width: 48vmax; height: 48vmax; left: 24%; top: 12%;
      background: radial-gradient(circle, rgba(8, 68, 150, .13), transparent 68%);
      filter: blur(72px); opacity: .6;
      animation: latido 16s ease-in-out infinite;
    }
    .arco {
      position: absolute; width: min(65vw, 900px); aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(28, 157, 247, .10);
      box-shadow: inset 0 0 42px rgba(15, 87, 177, .065), 0 0 24px rgba(15, 87, 177, .04);
      animation: rotar 55s linear infinite;
    }
    .arco::before, .arco::after {
      content: ""; position: absolute; inset: 10%; border-radius: inherit;
      border: 1px dashed rgba(34, 211, 248, .12);
    }
    .arco::after {
      inset: 25%; border-color: rgba(157, 83, 255, .12);
      border-style: solid;
    }
    .arco.uno { top: -45%; right: -19%; }
    .arco.dos { bottom: -65%; left: -25%; animation-direction: reverse; animation-duration: 77s; }
    .rayo {
      position: absolute; width: 55vw; height: 2px; opacity: .40;
      background: linear-gradient(90deg, transparent, rgba(30, 204, 255, .64), transparent);
      filter: drop-shadow(0 0 9px rgba(24, 193, 255, .7));
      transform-origin: center;
      will-change: transform;
    }
    .rayo.superior {
      top: 10%; left: -20%;
      transform: rotate(-28deg);
      animation: rayoA 12s ease-in-out infinite alternate;
    }
    .rayo.inferior {
      bottom: 9%; right: -18%;
      background: linear-gradient(90deg, transparent, rgba(170, 75, 255, .6), transparent);
      transform: rotate(-28deg);
      animation: rayoB 15s ease-in-out infinite alternate;
    }
    .filo {
      position: absolute; width: min(31vw, 540px); height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--azul), transparent);
      box-shadow: 0 0 11px rgba(13, 190, 252, .6);
      animation: respirar 5s ease-in-out infinite alternate;
    }
    .filo.arriba {
      top: 0; left: 9%;
      transform: skewX(-35deg);
    }
    .filo.abajo {
      bottom: 0; right: 8%;
      background: linear-gradient(90deg, transparent, var(--violeta), #23bfff, transparent);
      animation-delay: -2.5s;
    }
    .esquina {
      position: absolute; width: 12vw; height: 12vw;
      max-width: 220px; max-height: 220px;
      min-width: 85px; min-height: 85px;
      border-color: rgba(41, 201, 255, .78);
      opacity: .56; filter: drop-shadow(0 0 10px rgba(19, 139, 240, .4));
    }
    .esquina.si {
      top: 2.1%; left: 1.2%;
      border-top: 2px solid; border-left: 2px solid;
      border-top-left-radius: 22px;
    }
    .esquina.sd {
      top: 2.1%; right: 1.2%;
      border-top: 2px solid; border-right: 2px solid;
      border-top-right-radius: 22px;
      border-color: rgba(158, 94, 255, .72);
    }
    .esquina.ii {
      bottom: 2.1%; left: 1.2%;
      border-bottom: 2px solid; border-left: 2px solid;
      border-bottom-left-radius: 22px;
      border-color: rgba(149, 82, 255, .72);
    }
    .esquina.id {
      bottom: 2.1%; right: 1.2%;
      border-bottom: 2px solid; border-right: 2px solid;
      border-bottom-right-radius: 22px;
    }
    .sombra {
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 28%, rgba(18, 50, 95, .05) 47%, transparent 65%);
      animation: barrido 17s ease-in-out infinite;
    }
    @keyframes malla {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 152px, 152px 0; }
    }
    @keyframes polvo {
      from { transform: translate3d(-1.4%, -1%, 0); opacity: .42; }
      to { transform: translate3d(1.4%, 1.5%, 0); opacity: .82; }
    }
    @keyframes haloCian {
      from { transform: translate3d(0, 0, 0) scale(.9); opacity: .27; }
      to { transform: translate3d(-10vw, 9vh, 0) scale(1.12); opacity: .43; }
    }
    @keyframes haloMorado {
      from { transform: translate3d(0, 0, 0) scale(1); opacity: .26; }
      to { transform: translate3d(11vw, -7vh, 0) scale(.92); opacity: .44; }
    }
    @keyframes latido {
      0%, 100% { transform: scale(.9); opacity: .25; }
      50% { transform: scale(1.1); opacity: .65; }
    }
    @keyframes rotar { to { transform: rotate(360deg); } }
    @keyframes rayoA {
      to { transform: translate3d(17vw, 12vh, 0) rotate(-28deg); opacity: .6; }
    }
    @keyframes rayoB {
      to { transform: translate3d(-13vw, -9vh, 0) rotate(-28deg); opacity: .55; }
    }
    @keyframes respirar { to { opacity: .25; filter: brightness(1.5); } }
    @keyframes barrido {
      0%, 100% { transform: translateX(-110%); }
      55% { transform: translateX(105%); }
    }
    @media (max-width: 700px) {
      .arco { width: 100vw; }
      .halo { filter: blur(60px); }
      .cuadricula { opacity: .24; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="escena" aria-label="Fondo animado FUTUREO LIVE, sin textos ni paneles">
    <div class="cuadricula" aria-hidden="true"></div>
    <div class="particulas" aria-hidden="true"></div>
    <div class="halo cian" aria-hidden="true"></div>
    <div class="halo morado" aria-hidden="true"></div>
    <div class="halo central" aria-hidden="true"></div>
    <div class="arco uno" aria-hidden="true"></div>
    <div class="arco dos" aria-hidden="true"></div>
    <div class="rayo superior" aria-hidden="true"></div>
    <div class="rayo inferior" aria-hidden="true"></div>
    <div class="sombra" aria-hidden="true"></div>
    <div class="filo arriba" aria-hidden="true"></div>
    <div class="filo abajo" aria-hidden="true"></div>
    <div class="esquina si" aria-hidden="true"></div>
    <div class="esquina sd" aria-hidden="true"></div>
    <div class="esquina ii" aria-hidden="true"></div>
    <div class="esquina id" aria-hidden="true"></div>
  </main>
</body>
</html>
