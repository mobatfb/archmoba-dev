name: MINGA TV Android APK

on:
  push:
    branches: [main]
    paths:
      - 'TVAPP/android/**'
      - '.github/workflows/minga-tv-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Construir MINGA TV APK
        run: |
          gradle -p TVAPP/android :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar paquete generado
        run: |
          test -s TVAPP/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh TVAPP/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: MINGA-TV-Android-debug
          path: TVAPP/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
