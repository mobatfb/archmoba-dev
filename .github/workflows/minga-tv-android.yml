name: MINGA TV Android APK

on:
  push:
    branches: [main]
    paths:
      - 'TVAPP/android/**'
      - '.github/workflows/minga-tv-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar SDK Android preinstalado
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Instalar plataforma y herramientas Android
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Configurar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Crear icono cuadrado desde el logo original
        run: |
          java TVAPP/android/tools/GenerateIcon.java \
            TVAPP/assets/minga_tv_logo.png \
            TVAPP/android/app/src/main/res/drawable-nodpi/ic_minga_square.png

      - name: Verificar separacion de icono y splash
        run: |
          grep -q 'ImageView.ScaleType.FIT_CENTER' TVAPP/android/app/src/main/java/com/archmoba/mingatv/SplashActivity.java
          grep -q 'R.drawable.minga_tv_logo' TVAPP/android/app/src/main/java/com/archmoba/mingatv/SplashActivity.java
          ! grep -q 'windowSplashScreenAnimatedIcon.*minga_tv_logo' TVAPP/android/app/src/main/res/values-v31/styles.xml
          grep -q '@drawable/ic_minga_square' TVAPP/android/app/src/main/AndroidManifest.xml

      - name: Construir MINGA TV APK
        run: |
          gradle -p TVAPP/android :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar paquete generado
        run: |
          test -s TVAPP/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh TVAPP/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: MINGA-TV-Android-debug
          path: TVAPP/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar enlace directo de descarga
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp TVAPP/android/app/build/outputs/apk/debug/app-debug.apk /tmp/MINGA-TV-Android-debug.apk
          if ! gh release view minga-tv-android-preview >/dev/null 2>&1; then
            gh release create minga-tv-android-preview \
              --title "MINGA TV Android - version de prueba" \
              --notes "APK de prueba de MINGA TV para Android, generado con GitHub Actions." \
              --prerelease
          fi
          gh release upload minga-tv-android-preview /tmp/MINGA-TV-Android-debug.apk --clobber
