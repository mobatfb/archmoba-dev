name: FUTUREO - Anfitrion v2.3.1 con paneles
on:
  push:
    paths:
      - 'MULTIMANDO/ANFITRION/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py'
      - 'MULTIMANDO/ANFITRION/futureo_stream_v22.py'
      - 'MULTIMANDO/ANFITRION/tests/test_gui_panels_v231.py'
      - 'MULTIMANDO/ANFITRION/README_PANELES_V2_3_1.md'
      - 'MULTIMANDO/FUTUREO_VJOY/instalador_windows/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py'
      - '.github/workflows/futureo-anfitrion-paneles-v231.yml'
  workflow_dispatch:
concurrency:
  group: futureo-anfitrion-panels-v231
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis y motor de turnos sin Windows
        shell: bash
        run: |
          python -m py_compile MULTIMANDO/ANFITRION/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py
          python -m py_compile MULTIMANDO/ANFITRION/futureo_stream_v22.py
          python MULTIMANDO/ANFITRION/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py --selftest
          cmp MULTIMANDO/ANFITRION/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py MULTIMANDO/FUTUREO_VJOY/instalador_windows/MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py
      - name: Comprobar GUI real con Tkinter y pantalla virtual
        shell: bash
        run: |
          python -m pip install Pillow
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth
          fi
          xvfb-run -a python MULTIMANDO/ANFITRION/tests/test_gui_panels_v231.py
      - name: Construir paquete completo de anfitrion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('MULTIMANDO')
          source = root / 'ANFITRION'
          out = root / 'FUTUREO_VJOY' / 'instalador_windows' / 'MULTIMANDO_FUTUREO_ANFITRION_v2_3_1_PANELES.zip'
          files = ('MULTIMANDO_FUTUREO_Anfitrion_v2_3_1.py',
                   'futureo_stream_v22.py')
          with ZipFile(out, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for name in files:
                  z.write(source / name, name)
              z.write(source / 'README_PANELES_V2_3_1.md', 'LEEME_PRIMERO.md')
          with ZipFile(out) as z:
              assert z.testzip() is None
              assert set(files).issubset(set(z.namelist()))
              assert len(z.namelist()) == 3
              assert not any('.exe' in x or '.enc' in x or '.sys' in x for x in z.namelist())
          print('ZIP probado:', out, out.stat().st_size, 'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FUTUREO_ANFITRION_PANELES_v2_3_1
          path: MULTIMANDO/FUTUREO_VJOY/instalador_windows/MULTIMANDO_FUTUREO_ANFITRION_v2_3_1_PANELES.zip
          retention-days: 30
      - name: Publicar ZIP probado en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MULTIMANDO/FUTUREO_VJOY/instalador_windows/MULTIMANDO_FUTUREO_ANFITRION_v2_3_1_PANELES.zip
          if ! git diff --cached --quiet; then
            git commit -m "build(futureo): ZIP anfitrion con paneles v2.3.1"
            git pull --rebase origin main
            git push
          fi
