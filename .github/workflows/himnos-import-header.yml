name: Himnos Policiales - importar cabecera definitiva
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/himnos-import-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Pillow
        run: python3 -m pip install --quiet pillow
      - name: Importar cabecera limpia sin escudo central
        env:
          ARTWORK_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/048ac6e6-12b9-47a8-92bc-c8eb39ff03b6.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzlhNjg1MGFhNWE1NmE1OCIsImJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDM3MDU3MH0.lwO0bcTbhB5cTE923CkPlAtGwl9mzP7Rpr9G9GQGu14'
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          from io import BytesIO
          import hashlib
          import os
          from urllib.request import urlopen, Request
          req = Request(os.environ["ARTWORK_URL"], headers={"User-Agent":"APKBDEV-artwork-import/1.0"})
          with urlopen(req, timeout=35) as response:
              image_data = response.read(5_000_000)
          digest = hashlib.sha256(image_data).hexdigest()
          expected = "64165ddd903746fa83870062ca4cd2700753788cb18e6ff996e4c3b39a627e48"
          if digest != expected:
              raise RuntimeError("El fondo visual descargado no coincide con la ilustración aprobada: " + digest)
          image = Image.open(BytesIO(image_data)).convert("RGB")
          if image.size != (862,1825):
              raise RuntimeError("Tamaño de imagen incorrecto: " + repr(image.size))
          header = image.crop((0,89,862,838))
          path = Path("apkbdev/projects/himnos-policiales/app/src/main/assets/cabecera.webp")
          path.parent.mkdir(parents=True,exist_ok=True)
          header.save(path, "WEBP", quality=87, method=6)
          print("Nueva cabecera sin escudo central",path.stat().st_size,"bytes")
          PY
      - name: Guardar recurso en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apkbdev/projects/himnos-policiales/app/src/main/assets/cabecera.webp
          if git diff --cached --quiet; then
            echo "Cabecera ya presente"
          else
            git commit -m "Himnos Policiales: cabecera sin escudo central"
            git push origin HEAD:main
          fi
