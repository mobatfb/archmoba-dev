name: FUTUREO VJOY - comprobar instalador sin ejecutarlo
on:
  push:
    paths:
      - "MULTIMANDO/FUTUREO_VJOY/instalador_windows/**"
      - ".github/workflows/futureo-vjoy-installer-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de PowerShell
        shell: powershell
        run: |
          $path = '.\MULTIMANDO\FUTUREO_VJOY\instalador_windows\HERRAMIENTAS\instalador.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "ERROR PowerShell: $($_.Message) line $($_.Extent.StartLineNumber)" }
            throw "El instalador tiene errores de sintaxis PowerShell"
          }
          Write-Host 'Sintaxis PowerShell correcta'
      - name: Validar UAC del menu y manejo de certificados
        shell: powershell
        run: |
          $path = '.\MULTIMANDO\FUTUREO_VJOY\instalador_windows\HERRAMIENTAS\instalador.ps1'
          $lines = Get-Content $path
          $line = $lines | Where-Object { $_.Trim().StartsWith('$needsAdmin =') } | Select-Object -First 1
          if (-not $line -or -not $line.Contains("'Menu'")) {
            throw 'El menu no solicita UAC: error 0x80070005 puede repetirse'
          }
          $source = Get-Content $path -Raw
          if ($source -notmatch 'Start-Process.*-Verb RunAs.*-PassThru') {
            throw 'Falta elevacion explicita con UAC'
          }
          if ($source -notmatch 'function ImportTestCertificate' -or $source -notmatch 'Import-Certificate') {
            throw 'Falta gestion del certificado'
          }
          Write-Host 'Contrato de permisos del menu correcto; no se modifica Windows.'
      - name: Comprobar diagnostico y alternativa CertUtil sin cambiar directivas
        shell: powershell
        run: |
          $script = Get-Content '.\MULTIMANDO\FUTUREO_VJOY\instalador_windows\HERRAMIENTAS\instalador.ps1' -Raw
          if ($script -notmatch "function ImportIntoMachineStore" -or $script -notmatch "function DiagnoseCertificate") {
            throw 'Faltan las funciones de diagnostico de certificados.'
          }
          if ($script -notmatch "certutil.exe -addstore" -or $script -notmatch "TrustedPublisher") {
            throw 'Falta la alternativa oficial de instalacion en almacenes de equipo.'
          }
          if ($script -notmatch "function CertPresent") { throw 'No se comprueba que el certificado este instalado' }
          $bat = Get-Content '.\MULTIMANDO\FUTUREO_VJOY\instalador_windows\DIAGNOSTICAR_CERTIFICADO.bat' -Raw
          if ($bat -notmatch "DiagnosticarCert") { throw 'BAT de diagnostico no inicia la opcion correcta' }
          Write-Host 'Diagnostico y fallback certutil detectados, sin instalar certificados en CI.'
      - name: Compilar envoltura CSharp de SetupAPI sin instalar
        shell: powershell
        run: |
          $path = '.\MULTIMANDO\FUTUREO_VJOY\instalador_windows\HERRAMIENTAS\instalador.ps1'
          $s = Get-Content $path -Raw
          $match = [regex]::Match($s, '(?s)\$code=@''\s*\r?\n(.*?)\r?\n''@')
          if(-not $match.Success) { throw "No se encontro codigo SetupAPI en instalador" }
          Add-Type -TypeDefinition $match.Groups[1].Value -Language CSharp -ErrorAction Stop
          if(-not ([type]::GetType("FutureoRootDevice"))) { Write-Host "Codigo CSharp compilado"; }
      - name: Comprobar comandos BAT de instalacion y desinstalacion
        shell: powershell
        run: |
          $dir='.\MULTIMANDO\FUTUREO_VJOY\instalador_windows'
          foreach($name in @("INSTALAR.bat","INSTALAR_1_MANDO.bat","INSTALAR_8_MANDOS.bat","PREPARAR_MODO_PRUEBA.bat","DESINSTALAR.bat","DIAGNOSTICAR.bat","VOLVER_MODO_NORMAL.bat","DIAGNOSTICAR_CERTIFICADO.bat")) {
            $p = Join-Path $dir $name
            if(-not (Test-Path $p)) { throw "Falta: $name" }
            $text=Get-Content $p -Raw
            if($text -notmatch "instalador\.ps1" ) { throw "Sin referencia al instalador: $name" }
          }
          Write-Host "Entradas BAT correctas, sin modificaciones de Windows durante CI."
