name: APKBDEV - Android APK Builder

on:
  push:
    branches: [main]
    paths:
      - 'apkbdev/**'
      - '.github/workflows/apkbdev-build.yml'
  workflow_dispatch:
    inputs:
      project:
        description: 'Nombre de carpeta dentro de apkbdev/projects'
        required: true
        type: string
        default: 'orbit-launcher'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_SLUG: ${{ github.event.inputs.project || 'orbit-launcher' }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Seleccionar TVAPP para compilaciones automáticas
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^apkbdev/projects/tvapp/'; then
            echo 'PROJECT_SLUG=tvapp' >> "$GITHUB_ENV"
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Activar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Android SDK del runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"

      - name: Instalar Android SDK 35
        run: python3 apkbdev/tools/prepare_sdk.py

      - name: Validar dependencias
        run: python3 apkbdev/tools/doctor.py --strict

      - name: Probar generador de apps
        run: python3 -m unittest discover -s apkbdev/tests -p 'test_*.py' -v

      - name: Probar orientacion y ahorro de bateria Colibri (Java)
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-orientation"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orbit-orientation" \
            apkbdev/projects/orbit-launcher/app/src/main/java/com/archmoba/colibri/DockOrientation.java \
            apkbdev/projects/orbit-launcher/app/src/main/java/com/archmoba/colibri/DockMotionPolicy.java \
            apkbdev/tests/OrbitOrientationTest.java
          java -cp "$RUNNER_TEMP/orbit-orientation" com.archmoba.colibri.OrbitOrientationTest

      - name: Probar indicador de notificaciones nuevas (Java)
        run: |
          mkdir -p "$RUNNER_TEMP/orbit-badges"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/orbit-badges" \
            apkbdev/projects/orbit-launcher/app/src/main/java/com/archmoba/colibri/BadgeFreshnessPolicy.java \
            apkbdev/tests/BadgeFreshnessTest.java
          java -cp "$RUNNER_TEMP/orbit-badges" com.archmoba.colibri.BadgeFreshnessTest

      - name: Compilar proyecto Android
        run: python3 apkbdev/tools/build_apk.py --project "$PROJECT_SLUG"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: APKBDEV-${{ env.PROJECT_SLUG }}
          path: apkbdev/dist/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release de pruebas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="apkbdev-${PROJECT_SLUG}-run-${GITHUB_RUN_NUMBER}"
          FILE="apkbdev/dist/${PROJECT_SLUG}/${PROJECT_SLUG}-debug.apk"
          gh release create "$TAG" "$FILE#${PROJECT_SLUG}-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "APKBDEV ${PROJECT_SLUG} build ${GITHUB_RUN_NUMBER}" \
            --notes "APK debug de prueba. Proyecto: ${PROJECT_SLUG}. Construido desde APKBDEV con GitHub Actions." \
            --prerelease
