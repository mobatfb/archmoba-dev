name: TVAPP Python Verify

on:
  push:
    branches: [main]
    paths:
      - 'TVAPP/tvapp.py'
      - '.github/workflows/tvapp-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis y utilidades Xtream
        run: |
          python -m py_compile TVAPP/tvapp.py
          python - <<'PY'
          import ast
          import re
          from pathlib import Path
          from urllib.parse import quote, urlsplit
          source = Path("TVAPP/tvapp.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          names = {"normalize_xtream_server", "xtream_stream_url",
                   "xtream_parse_catalog", "xtream_parse_episodes",
                   "xtream_favorite_key"}
          funcs = [node for node in tree.body
                   if isinstance(node, ast.FunctionDef) and node.name in names]
          assert {node.name for node in funcs} == names
          helpers = {}
          helpers.update(re=re, quote=quote, urlsplit=urlsplit)
          exec(compile(ast.Module(body=funcs, type_ignores=[]), "helpers", "exec"), helpers)
          normalize = helpers["normalize_xtream_server"]
          assert normalize("http://stream.example:80/") == "http://stream.example:80"
          try:
              normalize("file:///etc/passwd")
              raise AssertionError("URL scheme no validado")
          except ValueError:
              pass
          session = {"server": "http://stream.example:80",
                     "user": "example_user", "password": "example_password",
                     "output": "m3u8"}
          live = {"source": "xtream", "kind": "live", "stream_id": "42",
                  "account_tag": "local_test"}
          url = helpers["xtream_stream_url"](session, live)
          assert url.endswith("/live/example_user/example_password/42.m3u8")
          item = helpers["xtream_parse_catalog"](
              [{"stream_id": 42, "name": "Canal", "category_id": "1"}],
              {"1": "Noticias"}, "live", "local_test")[0]
          assert item["group"] == "Noticias" and "url" not in item
          assert helpers["xtream_favorite_key"](item) == "xc:local_test:live:42"
          episodes = helpers["xtream_parse_episodes"](
              {"episodes": {"1": [{"id": "99", "episode_num": 1, "title": "Piloto"}]}},
              {"name": "Serie", "logo": ""}, "local_test")
          assert episodes[0]["stream_id"] == "99"
          assert "VERSION = \"1.0.15\"" in source
          # Ejecutar la acción de modo interno sin levantar una ventana.
          class TestVar:
              def __init__(self):
                  self.value = "mock-secret"
              def set(self, value):
                  self.value = value
          class TestApp:
              def __init__(self):
                  self.xtream_auth_token = 0
                  self.xtream_connecting = True
                  self.xc_password = TestVar()
                  self.use_internal = False
                  self.active_tab = "Cuenta"
                  self.selected_category = ""
              def _select_category(self, category):
                  self.selected_category = category
          cls = next(node for node in tree.body if isinstance(node, ast.ClassDef)
                     and node.name == "TVSports")
          internal = next(node for node in cls.body
                          if isinstance(node, ast.FunctionDef) and node.name == "_use_internal")
          ns = {}
          exec(compile(ast.Module(body=[internal], type_ignores=[]), "test_internal", "exec"), ns)
          app = TestApp()
          ns["_use_internal"](app)
          assert app.use_internal and app.selected_category == "Todos"
          assert app.active_tab == "Vivo" and app.xc_password.value == ""
          assert app.xtream_auth_token == 1 and not app.xtream_connecting
          assert "Usar interno  ·  IPTV-org" in source
          assert '"Todos": "index.m3u"' in source
          print("TVAPP v1.0.15 - comprobaciones correctas")
          PY
