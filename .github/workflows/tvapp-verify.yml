name: TVAPP Python Verify

on:
  push:
    branches: [main]
    paths:
      - 'TVAPP/tvapp.py'
      - '.github/workflows/tvapp-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar sintaxis y utilidades Xtream
        run: |
          python -m py_compile TVAPP/tvapp.py
          python - <<'PY'
          import ast
          import re
          from pathlib import Path
          from urllib.parse import quote, urlsplit
          source = Path("TVAPP/tvapp.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          names = {"normalize_xtream_server", "xtream_stream_url",
                   "xtream_parse_catalog", "xtream_parse_episodes",
                   "xtream_favorite_key"}
          funcs = [node for node in tree.body
                   if isinstance(node, ast.FunctionDef) and node.name in names]
          assert {node.name for node in funcs} == names
          helpers = {}
          helpers.update(re=re, quote=quote, urlsplit=urlsplit)
          exec(compile(ast.Module(body=funcs, type_ignores=[]), "helpers", "exec"), helpers)
          normalize = helpers["normalize_xtream_server"]
          assert normalize("http://stream.example:80/") == "http://stream.example:80"
          try:
              normalize("file:///etc/passwd")
              raise AssertionError("URL scheme no validado")
          except ValueError:
              pass
          session = {"server": "http://stream.example:80",
                     "user": "example_user", "password": "example_password",
                     "output": "m3u8"}
          live = {"source": "xtream", "kind": "live", "stream_id": "42",
                  "account_tag": "local_test"}
          url = helpers["xtream_stream_url"](session, live)
          assert url.endswith("/live/example_user/example_password/42.m3u8")
          item = helpers["xtream_parse_catalog"](
              [{"stream_id": 42, "name": "Canal", "category_id": "1"}],
              {"1": "Noticias"}, "live", "local_test")[0]
          assert item["group"] == "Noticias" and "url" not in item
          assert helpers["xtream_favorite_key"](item) == "xc:local_test:live:42"
          episodes = helpers["xtream_parse_episodes"](
              {"episodes": {"1": [{"id": "99", "episode_num": 1, "title": "Piloto"}]}},
              {"name": "Serie", "logo": ""}, "local_test")
          assert episodes[0]["stream_id"] == "99"
          assert "VERSION = \"1.0.16\"" in source
          # Validar ambas modalidades sin abrir ventanas tkinter.
          cls = next(node for node in tree.body
                     if isinstance(node, ast.ClassDef) and node.name == "TVSports")
          methods = {"_clear_external_session", "_use_internal", "_use_external",
                     "_switch_mode", "_sidebar_categories", "_sidebar_row_count"}
          selected = [node for node in cls.body
                      if isinstance(node, ast.FunctionDef) and node.name in methods]
          assert {node.name for node in selected} == methods
          test_ns = {
              "SOURCES": {"Todos": "index.m3u", "Deportes": "categories/sports.m3u",
                          "Noticias": "categories/news.m3u"},
              "XTREAM_SECTIONS": ("Xtream TV", "Xtream Cine", "Xtream Series"),
              "HERO_BOTTOM": 222,
          }
          exec(compile(ast.Module(body=selected, type_ignores=[]),
                       "test_modes", "exec"), test_ns)
          class TestVar:
              def __init__(self):
                  self.value = "secret-in-memory"
              def set(self, value):
                  self.value = value
          class TestPicker:
              def place_forget(self):
                  pass
          class Fake:
              def __init__(self):
                  self.mode = None
                  self.use_internal = False
                  self.xtream_auth_token = 0
                  self.xtream_connecting = True
                  self.xtream_session = {"password": "secret-in-memory"}
                  self.xc_password = TestVar()
                  self.catalogs = {"Xtream TV": [], "Deportes": []}
                  self.category_offset = 4
                  self.channel_offset = 4
                  self.series_request_id = 0
                  self.request_id = 0
                  self.series_items = []
                  self.series_name = "Original"
                  self.group_picker = TestPicker()
                  self.selected = None
                  self.selected_category = None
                  self.redraws = 0
                  self.active_tab = "Cuenta"
              def _clear_external_session(self):
                  return test_ns["_clear_external_session"](self)
              def _select_category(self, category):
                  self.selected_category = category
              def _release_player(self):
                  pass
              def redraw(self):
                  self.redraws += 1
          app = Fake()
          assert test_ns["_sidebar_categories"](app) == []
          test_ns["_use_internal"](app)
          assert app.mode == "local" and app.use_internal
          assert app.selected_category == "Todos"
          assert app.xc_password.value == "" and app.xtream_session is None
          assert test_ns["_sidebar_categories"](app) == [
              "Todos", "Deportes", "Noticias", "Favoritos"]
          assert "Xtream TV" not in test_ns["_sidebar_categories"](app)
          assert test_ns["_sidebar_row_count"](app, 595) >= 1
          test_ns["_use_external"](app)
          assert app.mode == "external" and not app.use_internal
          assert app.selected_category == "Xtream TV"
          assert test_ns["_sidebar_categories"](app) == [
              "Xtream TV", "Xtream Cine", "Xtream Series", "Favoritos"]
          assert "Noticias" not in test_ns["_sidebar_categories"](app)
          test_ns["_switch_mode"](app)
          assert app.mode is None and app.selected_category == "Xtream TV"
          assert app.category == "" and app.redraws == 1
          assert "Modo local multirregión" in source
          assert "Modo servidor externo" in source
          assert "self._draw_mode_choice(w,h)" in source
          assert '"Todos": "index.m3u"' in source
          assert 'VERSION = "1.0.17"' in source
          assert "xcmas.ddns.net" not in source
          assert 'self.xc_server = tk.StringVar(value="")' in source
          assert "Servidor (ej.: http://servidor:puerto)" in source
          print("TVAPP v1.0.17: acceso externo sin servidor predefinido OK")
          PY
