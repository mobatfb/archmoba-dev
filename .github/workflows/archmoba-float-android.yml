name: Build ARCHMOBA Float Android APK
on:
  push:
    branches: [feature/archmoba-floating-launcher]
    paths:
      - "apps/archmoba-floating-launcher/source.tar.xz.b64"
      - ".github/workflows/archmoba-float-android.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Android app sources
        run: |
          cd apps/archmoba-floating-launcher
          base64 -d source.tar.xz.b64 | tar -xJ
      - name: Compile
        run: |
          gradle -p apps/archmoba-floating-launcher :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARCHMOBA-Float-APK
          path: apps/archmoba-floating-launcher/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch
        run: |
          mkdir -p releases
          cp apps/archmoba-floating-launcher/app/build/outputs/apk/debug/app-debug.apk releases/ARCHMOBA-Float-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/ARCHMOBA-Float-debug.apk
          git diff --cached --quiet || (git commit -m 'build: publish ARCHMOBA Float debug APK' && git push origin HEAD:feature/archmoba-floating-launcher)
