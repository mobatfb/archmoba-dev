name: FUTUREO VJOY - compilar driver KMDF
on:
  push:
    paths:
      - "MULTIMANDO/FUTUREO_VJOY/driver/**"
      - "MULTIMANDO/FUTUREO_VJOY/packages.config"
      - "MULTIMANDO/FUTUREO_VJOY/Directory.Build.props"
      - ".github/workflows/futureo-vjoy-driver.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver-windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Instalar SDK y WDK oficiales (NuGet)
        shell: pwsh
        run: |
          nuget restore .\MULTIMANDO\FUTUREO_VJOY\packages.config -PackagesDirectory .\packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron descargar los paquetes WDK" }
      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Agregar herramientas WDK al PATH
        shell: pwsh
        run: |
          $tools = @(Get-ChildItem .\packages -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @('stampinf.exe','inf2cat.exe','infverif.exe','signtool.exe') })
          $tools | ForEach-Object { Write-Host "WDK: $($_.FullName)" }
          if (-not ($tools | Where-Object Name -eq "stampinf.exe")) { throw "stampinf.exe no está incluido en los paquetes NuGet restaurados" }
          $tools | ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Compilar FutJoy.sys (sin firmar ni instalar)
        shell: pwsh
        run: |
          msbuild .\MULTIMANDO\FUTUREO_VJOY\driver\FutJoy.vcxproj /t:Rebuild "/p:Configuration=Release" "/p:Platform=x64" "/p:TargetVersion=Windows10" "/p:WindowsTargetPlatformVersion=10.0.28000.0" "/p:SignMode=Off" "/p:FUTJOY_COMPILE_ONLY=true" "/p:DriverTargetPlatform=Desktop" "/p:RunApiValidator=false" "/p:EnableInfVerif=false" /nologo /v:normal /fl "/flp:LogFile=wdk-build.log;Verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación WDK. Revisa wdk-build.log" }
      - name: Aclarar el alcance de la compilacion
        shell: pwsh
        run: |
          Write-Host "Solo compilacion y enlace: ApiValidator e InfVerif deben ejecutarse con WDK completo."
          Write-Host "No hay firma de controlador ni prueba de instalacion en Windows."
      - name: Comprobar binario
        shell: pwsh
        run: |
          $drivers = @(Get-ChildItem .\MULTIMANDO\FUTUREO_VJOY\driver -Recurse -Filter FutJoy.sys -File)
          if ($drivers.Count -eq 0) { throw "La compilación no produjo FutJoy.sys" }
          $drivers | ForEach-Object { Write-Host "GENERADO: $($_.FullName) / bytes: $($_.Length)" }
      - name: Preparar paquete fuente para firma futura (NO INSTALABLE)
        shell: pwsh
        run: |
          $dest = Join-Path (Get-Location) 'futureo_driver_no_instalar'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item '.\MULTIMANDO\FUTUREO_VJOY\driver\x64\Release\FutJoy.sys' -Destination $dest -ErrorAction Stop
          Copy-Item '.\MULTIMANDO\FUTUREO_VJOY\driver\FutJoy.inf' -Destination $dest -ErrorAction Stop
          @(
            "FUTUREO VJOY - PAQUETE EXPERIMENTAL SIN FIRMA"
            "El INF ha sido comprobado por un flujo independiente de InfVerif."
            "Falta generar FutJoy.cat y obtener firma de Microsoft."
            "NO INSTALAR EN WINDOWS PRINCIPAL."
            "Solo fuente para preparar el proceso de validacion y firma."
          ) | Set-Content (Join-Path $dest 'NO_INSTALAR.txt') -Encoding utf8
          Get-ChildItem $dest -Filter 'FutJoy.*' -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content (Join-Path $dest 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "PAQUETE: $dest"
          Get-Content (Join-Path $dest 'SHA256SUMS.txt')
      - name: Guardar registro (siempre)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FUTUREO-VJOY-registro-WDK
          path: wdk-build.log
          if-no-files-found: ignore
      - name: Guardar paquete pre-firma (SIN FIRMA, NO INSTALAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FUTUREO-VJOY-PAQUETE-SIN-FIRMA-NO-INSTALAR
          path: futureo_driver_no_instalar/
          if-no-files-found: error
          retention-days: 7
      - name: Guardar binario experimental sin firma
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FUTUREO-VJOY-SYS-EXPERIMENTAL-SIN-FIRMA
          path: MULTIMANDO/FUTUREO_VJOY/driver/**/FutJoy.sys
          if-no-files-found: error
          retention-days: 7
