name: AMBOT Python Windows/Linux

on:
  push:
    paths:
      - "AMBOT/**"
      - ".github/workflows/ambot-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validar sintaxis Python
        run: python -m compileall -q AMBOT
      - name: Probar cerebro, API y actualizacion de cache
        run: python -m unittest discover -s AMBOT/tests -p "test_*.py" -v
